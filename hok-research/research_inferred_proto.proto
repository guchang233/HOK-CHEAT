syntax = "proto3";

// === Inferred message: BattlePacket / HeroSync (battle state updates) ===
message HeroInfo {
    Vector3 hero_position = 1;
    bool is_visible = 2;
    int32 camp = 3;
    Vector3 last_visible_location = 4;
    int32 last_visible_frame_no = 5;
    int32 camp_visible = 6;
    int32 main_hero_camp = 7;
    int32 main_hero_config_id = 8;
    int32 main_hero_index = 9;
    int32 main_hero_runtime_id = 10;
    int32 player_runtime_id = 11;
    int32 target_camp = 12;
    int32 target_config_id = 13;
    Vector3 target_pos_x = 14;
    Vector3 target_pos_z = 15;
    int32 target_runtime_id = 16;
    int32 frame_no = 17;
    int32 frame_id = 18;
    int32 dead_frame_no = 19;
    int32 last_dead_frameno = 20;
    int32 hero_count = 21;
    bytes hero_kill_record = 22;
    repeated Hero heros = 23;
    repeated HeroUpdate hero_updates = 24;
    bytes cooldown = 25;
    int32 slot_skill_id = 26;
    repeated Skill skills = 27;
    bytes skill_slots_damage = 28;
    bytes skilluse_record = 29;
    repeated NewSkillEvent new_skill_events = 30;
    int32 battle_id = 31;
    bytes in_battle_info = 32;
    bytes ops_target = 33;
    bytes attack_target = 34;
}

message Vector3 {
    float x = 1;
    float y = 2;
    float z = 3;
}

